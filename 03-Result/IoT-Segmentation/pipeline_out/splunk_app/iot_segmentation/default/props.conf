# Generated by pipeline/iotpipe.py: one stanza per sourcetype.
# Events are one JSON object per line with "ts" (epoch seconds) as the first key.

[iot:conn]
# One event per network connection (Zeek conn.log), attributed to a device
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 200000
TIME_PREFIX = ^\{"ts":
TIME_FORMAT = %s.%6N
MAX_TIMESTAMP_LOOKAHEAD = 20
KV_MODE = json
AUTO_KV_JSON = true
category = Network & Security
description = One event per network connection (Zeek conn.log), attributed to a device

