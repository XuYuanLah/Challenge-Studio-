# iotpipe site description for the IoT Segmentation project (ASUS RT-BE88U, IoT VLAN 107).
# No secrets in here: the HEC token comes from the environment (SPLUNK_HEC_TOKEN).

[site]
name = "i0n-home"
timezone = "Australia/Sydney"

[paths]
root = ".."
out  = "pipeline_out"

[splunk]
index = "iot"

[networks]
iot      = ["192.168.107.0/27", "fd00:d:e:6b::/64"]
main_lan = ["192.168.0.0/24", "fd00:d:e:f::/64"]
out_of_scope = ["192.168.114.0/27", "fd00:d:e:72::/64", "192.168.255.0/30"]   # roommate VLAN; ONT management
router_ips  = ["192.168.0.1", "192.168.107.1", "192.168.114.1", "fd00:d:e:f::1", "fd00:d:e:6b::1", "fd00:d:e:72::1"]
router_macs = ["cc:28:aa:2b:39:60", "92:28:aa:2b:39:62"]
dns_servers = ["192.168.0.8", "fd00:d:e:f::8"]

[captures]
pattern = "[0-9]*-[0-9]*_*"
default_iface = "wl0.2"
skip_vlan_tagged = true

[capture.flat]
state = "A"
baseline = true
description = "24 h, flat network (before segmentation)"
[capture.seg]
state = "C/D"
baseline = true
description = "24 h, segmented; Matter timeout fix during the window"
[capture.app_interaction]
state = "D"
description = "7 min of app use with an action log"
[capture.tapo]
state = "D"
description = "Tapo firmware update, Hue and switch power cycles"
[capture.upload]
state = "E"
description = "Simulated data theft: bulk and slow upload to cloud storage from a test laptop"
[capture.vfd]
state = "E"
description = "VFD clock boot"

