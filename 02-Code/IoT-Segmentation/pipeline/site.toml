[zeek]
bpf = "not vlan"
include_mdns = false

[tls]
ja4 = true

[firewall]
files = ["firewall_logs/*.log", "firewall_logs/*.txt"]
year = 2026
skip_unsynced = true

[pihole]
export = "pihole_export.csv"
window = "captures"
window_margin_s = 600

[annotations]
files = ["pipeline/annotations.csv"]

[privacy]
redact_url_params = ["sso", "auth", "token", "key", "password", "secret"]
